# appId is a neutral reverse-DNS placeholder, not a registered domain; replace with the owner's real id before distribution.
appId: com.mep.hvac
productName: MEP HVAC Design Assistant
executableName: mep-hvac
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{e2e,e2e-electron,out-e2e,docs,scripts,test-results,test-results-electron,playwright-report,playwright-report-electron,.agents,.cache,.superpowers,.vitest,dist}/**'
  - '!{AGENTS.md,GEMINI.md,vitest.config.ts,tsconfig.web.tsbuildinfo}'
asarUnpack:
  - resources/**
win:
  executableName: mep-hvac
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  # Placeholder: .deb requires a maintainer; replace with a real name <email> before distribution.
  maintainer: MEP HVAC maintainers <maintainers@invalid>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No publish/auto-update target is configured (the app ships no updater); null stops electron-builder inferring one from the git remote.
publish: null
